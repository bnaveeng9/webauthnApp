services:
  webauthnappclient:
    build:
      context: .
      dockerfile: Dockerfile
      target: runner
    image: naveeng9/webauthnapp-client:latest
    ports:
      - "3000:3000" # Nginx serving Angular app at http://localhost:8080
    networks:
      - webauthn-network
    volumes:
      - ./client/nginx.conf:/etc/nginx/nginx.conf # Mount custom Nginx config

  nginx:
    image: nginx:latest
    ports:
      - "8080:8080" # Nginx serving as a reverse proxy or static server
    networks:
      - webauthn-network
    depends_on:
      - webauthnappclient
    volumes:
     - ./client/nginx.conf:/etc/nginx/nginx.conf # Ensure the correct path to nginx.conf


networks:
  webauthn-network:
    driver: bridge