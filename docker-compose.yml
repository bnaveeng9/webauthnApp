services:
  webauthn-app:
    build:
      context: .
      dockerfile: Dockerfile
    ports:
      - "8080:8080"   # Access app at http://localhost:8080
    networks:
      - webauthn-network  # Attach to the shared network
    restart: unless-stopped
  nginx:
    image: nginx:alpine
    ports:
      - "4200:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:rw
      - webauthn-app_data:/usr/share/nginx/html/:rw
    depends_on:
      - webauthn-app 
    networks:
      - webauthn-network  # Attach to the shared network
volumes:
  webauthn-app_data:
  
networks:
  webauthn-network:  # Define the shared network
    driver: bridge